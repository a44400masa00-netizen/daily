name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Align package versions with the Expo SDK
        run: npx expo install --fix

      - name: Fetch openWakeWord feature models
        run: |
          d=modules/daily-native/android/src/main/assets/wakeword
          mkdir -p "$d"
          for f in melspectrogram.onnx embedding_model.onnx; do
            [ -s "$d/$f" ] || curl -fL --retry 3 -o "$d/$f" "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f"
          done
          test -s "$d/hey_daily.onnx" || { echo "::error::$d/hey_daily.onnx がありません。アップロードし直してください"; exit 1; }
          ls -la "$d"

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/daily-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-apk
          path: dist/*.apk
          if-no-files-found: error
