apply plugin: 'com.android.library'

group = 'expo.modules.daily'
version = '0.3.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.daily"
  defaultConfig {
    versionCode 1
    versionName "0.3.0"
  }
  lint {
    abortOnError false
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // 呼びかけ検出(openWakeWord)の推論に使う ONNX Runtime
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'

  // 端末内AI（Qwen2.5 3B Instruct, GGUF）を動かす、プリビルド済みのllama.cppラッパー。
  // NDK/CMakeのセットアップが要らず、Kotlin 2.1系のコンパイラともバージョンの衝突を起こさない
  // （以前使っていたLiteRT-LMはKotlin 2.4でビルドされていて、このモジュール以外の
  //  コンパイルまで巻き込んで失敗させていた。そのための回避策はもう不要）
  implementation 'dev.ffmpegkit-maintained:llama-android:0.1.0'

  // llama-android の suspend 関数をブロッキング呼び出しするためのコルーチン
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
